system_registry:
  version: "1.0"
  system_name: Sextant Protocol Ecosystem

  description: >
    Canonical registry mapping all repositories into a structured 3-layer architecture:
    INDEX (structural truth), ROUTING (governance interpretation), ENGINE (execution layer).

  layers:

    index_layer:
      name: "INDEX"
      role: "Structural Truth Layer"
      repository: "sextant-protocol-official-index"

      responsibility:
        - Defines system architecture
        - Maintains canonical structure
        - Holds registry definitions

      constraints:
        - no execution
        - no simulation logic
        - no governance transformation

    routing_layer:
      name: "ROUTING"
      role: "Governance Interpretation Layer"
      repository: "sextant-governance-routing-layer"

      responsibility:
        - Interprets index structure
        - Translates structure into governance rules
        - Defines policy transformation logic
        - Models cascade impact at governance level

      constraints:
        - non-executable
        - reference-only
        - no runtime enforcement

    engine_layer:
      name: "ENGINE"
      role: "Execution & Simulation Layer"

      repositories:
        - Sextant-Protocol
        - spd-r-google-cloud-poc
        - lena-vehicle-data-core
        - sextant-protocol-dp-system
        - sextant-orbital-resilience-framework

      responsibility:
        - Runs simulations
        - Executes cascade models
        - Processes observability data
        - Produces runtime outputs

      constraints:
        - must follow routing interpretation
        - cannot redefine index structure

  cross_repo_dependencies:

    index_to_routing:
      type: structural_definition
      flow: "INDEX → ROUTING"

    routing_to_engine:
      type: governance_translation
      flow: "ROUTING → ENGINE"

    engine_observability_feedback:
      type: read_only_signal_flow
      flow: "ENGINE → INDEX (observational only)"

  governance_rules:

    rule_1:
      name: layer_separation_enforcement
      description: "Each layer must only perform its defined role"

    rule_2:
      name: index_authority_lock
      description: "INDEX remains the sole source of structural truth"

    rule_3:
      name: routing_boundary_rule
      description: "ROUTING may interpret but not execute"

    rule_4:
      name: engine_execution_rule
      description: "ENGINE executes only within routed constraints"

  system_flow:
    - INDEX defines structure
    - ROUTING interprets structure into governance rules
    - ENGINE executes simulations
    - ENGINE emits observational signals
    - INDEX remains canonical reference layer
