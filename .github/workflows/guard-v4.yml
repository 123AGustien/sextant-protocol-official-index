name: Guard v4 - Step 3 Rules Layer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "NORMAL | SAFE | MAINTENANCE"
        default: "NORMAL"

  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'NORMAL' }}"
          echo "MODE=$MODE"
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      # ----------------------------
      # STEP 3: RULE ENGINE
      # ----------------------------
      - name: Guard Rule Engine (Step 3)
        run: |
          MODE="${{ steps.mode.outputs.mode }}"

          echo "🧭 Running Guard v4 Step 3"
          echo "Mode: $MODE"

          # ----------------------------
          # SAFE MODE
          # ----------------------------
          if [ "$MODE" = "SAFE" ]; then
            echo "SAFE MODE:"
            echo "- No enforcement"
            echo "- Logging only"
            echo "- System allowed to run"
            exit 0
          fi

          # ----------------------------
          # MAINTENANCE MODE
          # ----------------------------
          if [ "$MODE" = "MAINTENANCE" ]; then
            echo "MAINTENANCE MODE:"
            echo "- Skip guard checks"
            echo "- No blocking"
            echo "- CI still runs for validation"
            exit 0
          fi

          # ----------------------------
          # NORMAL MODE RULES
          # ----------------------------
          echo "NORMAL MODE: Applying guard rules"

          CHANGED=$(git diff --name-only HEAD~1 || true)
          echo "Changed files:"
          echo "$CHANGED"

          # Rule 1: detect workflow edits
          if echo "$CHANGED" | grep -E "^\.github/workflows/"; then
            echo "⚠️ Workflow change detected (logged only)"
          fi

          # Rule 2: prevent recursive trigger noise
          if echo "$GITHUB_EVENT_NAME" | grep -q "workflow_dispatch"; then
            echo "ℹ️ Manual run - skipping recursion risk"
          fi

          # Rule 3: safe completion
          echo "✅ Guard Step 3 complete (no blocking in v4 core)"
          exit 0
