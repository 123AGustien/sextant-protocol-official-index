name: 🛰️ Sextant Orbital Reprisory Simulation Test

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Simulation steps"
        required: false
        default: "10"

jobs:
  simulation-test:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # Set up Python
      # -----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------
      # Install dependencies (future-proof hook)
      # -----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      # -----------------------------------------
      # Ensure repo is importable
      # -----------------------------------------
      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      # -----------------------------------------
      # Run Orbital Simulation Engine
      # -----------------------------------------
      - name: Run Orbital Simulation
        run: |
          python orbital_reprisory/run_simulation.py \
            --steps "${{ github.event.inputs.steps }}"

      # -----------------------------------------
      # Capture simulation output (required upgrade)
      # -----------------------------------------
      - name: Upload Simulation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-simulation-output
          path: |
            output/
            logs/
