name: 🛰️ Sextant Orbital Reprisory Simulation Test

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Simulation steps"
        required: false
        default: "10"

jobs:
  simulation-test:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # Set up Python
      # -----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------
      # Install dependencies
      # -----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      # -----------------------------------------
      # FIX PYTHON IMPORT PATH (IMPORTANT)
      # -----------------------------------------
      - name: Fix Python import path (CI-safe)
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      # -----------------------------------------
      # Run Orbital Simulation Engine
      # -----------------------------------------
      - name: Run Orbital Simulation
        run: |
          python orbital_reprisory/run_simulation.py \
            --steps "${{ github.event.inputs.steps }}"

      # -----------------------------------------
      # SEVERITY + GOVERNANCE (CLOSED LOOP READY)
      # -----------------------------------------
      - name: Sextant Severity & Governance Gate
        run: |
          python - << 'EOF'
          import json
          import sys
          import os

          print("🧠 Loading cascade output...")

          file_path = "output/cascade_execution.json"

          if not os.path.exists(file_path):
              print("⚠ No cascade output found — using safe defaults")
              cascade = {"failed_nodes": [], "impacts_on_orbital": []}
          else:
              with open(file_path) as f:
                  cascade = json.load(f)

          failed_nodes = cascade.get("failed_nodes", [])
          impacts = cascade.get("impacts_on_orbital", [])

          DS = min(1.0, len(failed_nodes) * 0.3)
          PS = min(1.0, len(impacts) * 0.25)
          CD = 0.7
          OD = 1.0

          risk_score = (DS * PS * CD) / OD

          print("📊 Risk Score:", risk_score)

          if risk_score < 0.3:
              decision = "APPROVE"
          elif risk_score < 0.7:
              decision = "MONITOR"
          elif risk_score < 1.5:
              decision = "RESTRICT"
          else:
              decision = "BLOCK"

          print("🧾 Governance Decision:", decision)

          if decision == "BLOCK":
              print("⛔ EXECUTION BLOCKED BY SEXTANT GOVERNANCE")
              sys.exit(1)

          print("✔ Governance Passed")
          EOF

      # -----------------------------------------
      # Upload artifacts
      # -----------------------------------------
      - name: Upload Simulation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-simulation-output
          if-no-files-found: ignore
          path: |
            output/
            logs/
