name: Sextant Orbital Reprisory Simulation Test

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Simulation steps"
        required: false
        default: "10"

jobs:
  simulation-test:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------
      # Set up Python
      # -----------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------
      # Install dependencies
      # -----------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      # -----------------------------------------
      # Fix Python import path
      # -----------------------------------------
      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=." >> $GITHUB_ENV

      # -----------------------------------------
      # Run simulation engine (manual only)
      # -----------------------------------------
      - name: Run Orbital Simulation
        run: |
          python orbital_reprisory/run_simulation.py
